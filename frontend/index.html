<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Ligature | R&D Connected</title>
    <meta name="description" content="Intelligent Development & Operations Platform for Life Sciences R&D" />
    <meta name="theme-color" content="#0D1B2A" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ligature" />
    <!-- Blocking anti-FOUC script: stamps persisted theme class on <html> before first paint -->
    <script>
      (function(){try{
        var s=localStorage.getItem('ligature-theme');
        var id='ligature-light';
        if(s){try{var p=JSON.parse(s);if(p&&p.state&&p.state.currentThemeId)id=p.state.currentThemeId;}catch(e){}}
        var mode='light';
        if(id==='ligature-dark')mode='dark';
        else if(id==='high-contrast')mode='high-contrast';
        var r=document.documentElement;
        r.classList.remove('theme-light','theme-dark','theme-high-contrast');
        r.classList.add('theme-'+mode);
        requestAnimationFrame(function(){requestAnimationFrame(function(){r.setAttribute('data-theme-ready','1');});});
      }catch(e){}})();
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
