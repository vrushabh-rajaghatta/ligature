<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ligature | Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0D1B2A;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 420px;
    }
    .icon {
      width: 64px; height: 64px;
      margin: 0 auto 1.5rem;
      border-radius: 16px;
      background: linear-gradient(135deg, #1E90FF 0%, #14B8A6 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 700; color: white;
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.75rem; }
    p { color: #94A3B8; font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: #1E90FF; color: white; border: none;
      padding: 0.75rem 2rem; border-radius: 8px;
      font-size: 0.95rem; font-weight: 500; cursor: pointer;
      transition: background 150ms;
    }
    button:hover { background: #1a7de6; }
    .status { margin-top: 1.5rem; font-size: 0.8rem; color: #64748B; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">L</div>
    <h1>You're offline</h1>
    <p>Ligature requires a network connection to access regulatory data, submission workflows, and AI-powered features.</p>
    <button onclick="window.location.reload()">Try Again</button>
    <div class="status">Ligature R&D Connected Platform</div>
  </div>
</body>
</html>
